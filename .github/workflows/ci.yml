name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        # Ahead of the version in go.mod on purpose: the setup-envtest release
        # the Makefile pins needs Go 1.24 to install, and the operator itself
        # builds fine on a newer toolchain.
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      
      - name: Run golangci-lint
        # v7 and up run golangci-lint v2 only, which is why .golangci.yml is in
        # the v2 format. Pinned rather than `latest`: a new release must not be
        # able to fail a pull request that changed nothing.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m
      
      - name: Run tests
        run: make test
      
      - name: Build
        run: go build -v ./...
  
  docker-build-push:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always --abbrev=7)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            slepimis120/devops-shop-operator:${{ steps.version.outputs.version }}
            slepimis120/devops-shop-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
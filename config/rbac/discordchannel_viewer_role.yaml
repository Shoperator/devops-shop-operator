# permissions for end users to view discordchannels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: devops-shop-operator
    app.kubernetes.io/managed-by: kustomize
  name: discordchannel-viewer-role
rules:
- apiGroups:
  - shop.shophub.local
  resources:
  - discordchannels
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - shop.shophub.local
  resources:
  - discordchannels/status
  verbs:
  - get
